services:
  server1:
    image: nginx:alpine
    container_name: lb-server1
    volumes:
      - ./server1:/usr/share/nginx/html:ro
    restart: unless-stopped

  server2:
    image: nginx:alpine
    container_name: lb-server2
    volumes:
      - ./server2:/usr/share/nginx/html:ro
    restart: unless-stopped

  server3:
    image: nginx:alpine
    container_name: lb-server3
    volumes:
      - ./server3:/usr/share/nginx/html:ro
    restart: unless-stopped

  loadbalancer:
    image: nginx:alpine
    container_name: lb-loadbalancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
      - server3
    restart: unless-stopped
